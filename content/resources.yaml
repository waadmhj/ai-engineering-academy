# ───────────────────────────── PAPERS ─────────────────────────────
- { id: paper-attention, title: "Attention Is All You Need", provider: arXiv (NeurIPS 2017), type: paper, authors: "Vaswani et al.", year: 2017, level: advanced, duration: 2h, cost: free, url: "https://arxiv.org/abs/1706.03762", why: "Introduced the transformer.", summary: "Replaces recurrence with self-attention: every token looks at every other token in parallel, weighted by query–key similarity. Adds multi-head attention, positional encodings and an encoder–decoder stack.", impact: "Every modern LLM, embedding model and most vision models descend from this architecture. Parallelism made training at scale feasible." }
- { id: paper-bahdanau, title: "Neural Machine Translation by Jointly Learning to Align and Translate", provider: arXiv (ICLR 2015), type: paper, authors: "Bahdanau, Cho, Bengio", year: 2014, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/1409.0473", why: "The original attention mechanism.", summary: "Instead of squeezing a sentence into one fixed vector, the decoder learns to look back at (attend to) relevant encoder states at every step.", impact: "Solved the fixed-length bottleneck of seq2seq models and directly inspired the transformer." }
- { id: paper-seq2seq, title: "Sequence to Sequence Learning with Neural Networks", provider: arXiv (NeurIPS 2014), type: paper, authors: "Sutskever, Vinyals, Le", year: 2014, level: intermediate, duration: 1h, cost: free, url: "https://arxiv.org/abs/1409.3215", why: "Encoder–decoder LSTMs for translation.", summary: "One LSTM encodes the input sequence into a vector; another decodes it into the output sequence.", impact: "Established the encoder–decoder paradigm used by T5, Whisper and translation systems." }
- { id: paper-word2vec, title: "Efficient Estimation of Word Representations in Vector Space", provider: arXiv, type: paper, authors: "Mikolov et al.", year: 2013, level: intermediate, duration: 1h, cost: free, url: "https://arxiv.org/abs/1301.3781", why: "Word2vec — the paper that made embeddings mainstream.", summary: "Trains shallow networks to predict words from context (CBOW) or context from words (skip-gram); the learned weights are word vectors where similar words are close.", impact: "Showed meaning can be captured geometrically (king − man + woman ≈ queen); the conceptual ancestor of every embedding model." }
- { id: paper-bert, title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding", provider: arXiv (NAACL 2019), type: paper, authors: "Devlin et al.", year: 2018, level: advanced, duration: 1h 30m, cost: free, url: "https://arxiv.org/abs/1810.04805", why: "Encoder-only transformer pretrained with masked language modelling.", summary: "Masks 15% of tokens and trains a bidirectional encoder to predict them, then fine-tunes on downstream tasks.", impact: "Basis of most embedding models, rerankers and classifiers used in RAG today." }
- { id: paper-gpt3, title: "Language Models are Few-Shot Learners (GPT-3)", provider: arXiv (NeurIPS 2020), type: paper, authors: "Brown et al.", year: 2020, level: intermediate, duration: 2h, cost: free, url: "https://arxiv.org/abs/2005.14165", why: "Showed in-context (few-shot) learning emerges with scale.", summary: "A 175B-parameter decoder-only model can perform new tasks from a few examples in the prompt, without gradient updates.", impact: "Birth of prompting as an interface; few-shot prompting and the API-first LLM industry." }
- { id: paper-scaling-laws, title: "Scaling Laws for Neural Language Models", provider: arXiv, type: paper, authors: "Kaplan et al.", year: 2020, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/2001.08361", why: "Loss falls as a power law in parameters, data and compute.", summary: "Empirically fits how language-model loss depends on model size, dataset size and compute.", impact: "Turned model building into capacity planning; justified large-scale pretraining." }
- { id: paper-chinchilla, title: "Training Compute-Optimal Large Language Models (Chinchilla)", provider: arXiv, type: paper, authors: "Hoffmann et al.", year: 2022, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/2203.15556", why: "Revised scaling laws: train on far more tokens.", summary: "For a fixed compute budget, parameters and training tokens should scale equally (~20 tokens per parameter).", impact: "Changed how every lab sizes models — smaller models trained longer." }
- { id: paper-instructgpt, title: "Training language models to follow instructions with human feedback (InstructGPT)", provider: arXiv (NeurIPS 2022), type: paper, authors: "Ouyang et al.", year: 2022, level: advanced, duration: 1h 30m, cost: free, url: "https://arxiv.org/abs/2203.02155", why: "SFT + reward model + PPO = RLHF.", summary: "Fine-tune on human demonstrations, train a reward model on human preference rankings, then optimise the policy with PPO against it.", impact: "The recipe behind ChatGPT; a 1.3B InstructGPT was preferred over 175B GPT-3." }
- { id: paper-dpo, title: "Direct Preference Optimization: Your Language Model is Secretly a Reward Model", provider: arXiv (NeurIPS 2023), type: paper, authors: "Rafailov et al.", year: 2023, level: advanced, duration: 1h 30m, cost: free, url: "https://arxiv.org/abs/2305.18290", why: "Preference tuning without RL or a separate reward model.", summary: "Derives a simple classification-style loss on (chosen, rejected) pairs that optimises the same objective as RLHF.", impact: "Became the default preference-tuning method in open-source models because it is stable and cheap." }
- { id: paper-lora, title: "LoRA: Low-Rank Adaptation of Large Language Models", provider: arXiv (ICLR 2022), type: paper, authors: "Hu et al.", year: 2021, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/2106.09685", why: "Fine-tune by learning small low-rank update matrices.", summary: "Freezes pretrained weights W and learns ΔW = BA with rank r ≪ d, cutting trainable parameters by ~10,000×.", impact: "Made fine-tuning affordable; adapters can be swapped per tenant/task at serving time." }
- { id: paper-qlora, title: "QLoRA: Efficient Finetuning of Quantized LLMs", provider: arXiv (NeurIPS 2023), type: paper, authors: "Dettmers et al.", year: 2023, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/2305.14314", why: "LoRA on top of a 4-bit quantized base model.", summary: "Introduces 4-bit NormalFloat, double quantization and paged optimizers so a 65B model fits on a single 48GB GPU.", impact: "Put fine-tuning of large models within reach of a single consumer/cloud GPU." }
- { id: paper-rag, title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", provider: arXiv (NeurIPS 2020), type: paper, authors: "Lewis et al.", year: 2020, level: intermediate, duration: 1h, cost: free, url: "https://arxiv.org/abs/2005.11401", why: "Named and formalised RAG.", summary: "Combines a dense retriever (DPR) over Wikipedia with a seq2seq generator, treating retrieved passages as a latent variable.", impact: "The blueprint for grounding LLMs in external, updatable knowledge." }
- { id: paper-dpr, title: "Dense Passage Retrieval for Open-Domain Question Answering", provider: arXiv (EMNLP 2020), type: paper, authors: "Karpukhin et al.", year: 2020, level: intermediate, duration: 1h, cost: free, url: "https://arxiv.org/abs/2004.04906", why: "Showed dense bi-encoders beat BM25 for QA retrieval.", summary: "Trains separate question and passage encoders so relevant pairs have high dot product; uses in-batch negatives.", impact: "Standard architecture for dense retrieval and embedding models." }
- { id: paper-sbert, title: "Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks", provider: arXiv (EMNLP 2019), type: paper, authors: "Reimers, Gurevych", year: 2019, level: intermediate, duration: 45m, cost: free, url: "https://arxiv.org/abs/1908.10084", why: "Made BERT usable for fast semantic similarity.", summary: "Fine-tunes BERT in a siamese setup so sentence embeddings can be compared with cosine similarity, instead of running a cross-encoder on every pair.", impact: "Reduced similarity search from hours to milliseconds; birth of sentence-transformers." }
- { id: paper-colbert, title: "ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT", provider: arXiv (SIGIR 2020), type: paper, authors: "Khattab, Zaharia", year: 2020, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/2004.12832", why: "Multi-vector late-interaction retrieval.", summary: "Keeps one embedding per token and scores with MaxSim, balancing cross-encoder accuracy and bi-encoder speed.", impact: "Influential for high-precision retrieval and reranking." }
- { id: paper-splade, title: "SPLADE: Sparse Lexical and Expansion Model for First Stage Ranking", provider: arXiv (SIGIR 2021), type: paper, authors: "Formal, Piwowarski, Clinchant", year: 2021, level: advanced, duration: 45m, cost: free, url: "https://arxiv.org/abs/2107.05720", why: "Learned sparse embeddings.", summary: "Uses BERT's MLM head to produce sparse, vocabulary-sized vectors with term expansion, usable in inverted indexes.", impact: "Shows sparse ≠ keyword-only; foundation of learned-sparse hybrid search." }
- { id: paper-hnsw, title: "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs", provider: arXiv (IEEE TPAMI), type: paper, authors: "Malkov, Yashunin", year: 2016, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/1603.09320", why: "The HNSW index used by most vector databases.", summary: "Builds layered proximity graphs; search greedily descends from sparse top layers to dense bottom layers.", impact: "Default ANN index in Qdrant, Weaviate, Milvus, pgvector, Elasticsearch and others." }
- { id: paper-matryoshka, title: "Matryoshka Representation Learning", provider: arXiv (NeurIPS 2022), type: paper, authors: "Kusupati et al.", year: 2022, level: advanced, duration: 45m, cost: free, url: "https://arxiv.org/abs/2205.13147", why: "Embeddings that can be truncated.", summary: "Trains embeddings so prefixes (e.g. first 256 of 1024 dims) remain useful.", impact: "Lets you trade storage/latency for accuracy without re-embedding." }
- { id: paper-mteb, title: "MTEB: Massive Text Embedding Benchmark", provider: arXiv (EACL 2023), type: paper, authors: "Muennighoff et al.", year: 2022, level: intermediate, duration: 45m, cost: free, url: "https://arxiv.org/abs/2210.07316", why: "How embedding models are compared.", summary: "Benchmarks embeddings across 8 task types and 50+ datasets; no single model wins everything.", impact: "Standard reference for choosing embedding models — with the caveat to evaluate on your own data." }
- { id: paper-cot, title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", provider: arXiv (NeurIPS 2022), type: paper, authors: "Wei et al.", year: 2022, level: intermediate, duration: 45m, cost: free, url: "https://arxiv.org/abs/2201.11903", why: "Intermediate reasoning steps improve multi-step tasks.", summary: "Few-shot exemplars that show step-by-step reasoning dramatically improve arithmetic and logic performance in large models.", impact: "Foundation of reasoning prompts and, later, reasoning-trained models." }
- { id: paper-react, title: "ReAct: Synergizing Reasoning and Acting in Language Models", provider: arXiv (ICLR 2023), type: paper, authors: "Yao et al.", year: 2022, level: intermediate, duration: 45m, cost: free, url: "https://arxiv.org/abs/2210.03629", why: "The thought → action → observation loop.", summary: "Interleaves reasoning traces with tool actions, using observations to update the plan.", impact: "The core loop of nearly every tool-using agent." }
- { id: paper-toolformer, title: "Toolformer: Language Models Can Teach Themselves to Use Tools", provider: arXiv (NeurIPS 2023), type: paper, authors: "Schick et al.", year: 2023, level: advanced, duration: 45m, cost: free, url: "https://arxiv.org/abs/2302.04761", why: "Self-supervised learning of API calls.", summary: "The model annotates its own data with API calls and keeps the ones that reduce loss.", impact: "Early evidence that tool use can be learned, not only prompted." }
- { id: paper-reflexion, title: "Reflexion: Language Agents with Verbal Reinforcement Learning", provider: arXiv (NeurIPS 2023), type: paper, authors: "Shinn et al.", year: 2023, level: advanced, duration: 45m, cost: free, url: "https://arxiv.org/abs/2303.11366", why: "Self-reflection as memory.", summary: "After failing, the agent writes a verbal reflection stored in memory and retries.", impact: "Basis of reflection/self-correction patterns in agents." }
- { id: paper-generative-agents, title: "Generative Agents: Interactive Simulacra of Human Behavior", provider: arXiv (UIST 2023), type: paper, authors: "Park et al.", year: 2023, level: intermediate, duration: 1h, cost: free, url: "https://arxiv.org/abs/2304.03442", why: "Memory streams, retrieval by recency/importance/relevance, reflection.", summary: "Agents store observations, retrieve them with a scored mix of recency, importance and relevance, and periodically synthesise reflections.", impact: "Reference design for long-term agent memory." }
- { id: paper-dspy, title: "DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines", provider: arXiv (ICLR 2024), type: paper, authors: "Khattab et al.", year: 2023, level: advanced, duration: 1h, cost: free, url: "https://arxiv.org/abs/2310.03714", why: "Optimising prompts as programs.", summary: "Define modules with signatures; an optimizer bootstraps demonstrations and instructions to maximise a metric.", impact: "Moves prompt engineering towards measurable optimisation." }
- { id: paper-hyde, title: "Precise Zero-Shot Dense Retrieval without Relevance Labels (HyDE)", provider: arXiv (ACL 2023), type: paper, authors: "Gao et al.", year: 2022, level: intermediate, duration: 45m, cost: free, url: "https://arxiv.org/abs/2212.10496", why: "Query transformation via hypothetical documents.", summary: "Generate a hypothetical answer, embed it, and retrieve real documents similar to it.", impact: "Popular query-transformation technique in RAG." }
- { id: paper-lost-middle, title: "Lost in the Middle: How Language Models Use Long Contexts", provider: arXiv (TACL 2024), type: paper, authors: "Liu et al.", year: 2023, level: intermediate, duration: 45m, cost: free, url: "https://arxiv.org/abs/2307.03172", why: "Position of information in context matters.", summary: "Models use information at the start and end of long contexts better than in the middle.", impact: "Motivates reranking, context ordering and compression rather than stuffing the window." }
