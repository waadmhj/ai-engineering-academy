        <text x="320" y="135" fill="currentColor" opacity=".7" text-anchor="middle">Trained contrastively so related texts end up close (high cosine similarity)</text>
      </svg>
    caption: A sentence embedding is a pooled, usually L2-normalised, summary of contextual token vectors.

  - kind: math
    title: Mathematical view
    body: |
      Mean pooling with an attention mask $m_i \in \{0,1\}$ (ignore padding tokens):

      $$\mathbf{e} = \frac{\sum_{i=1}^{n} m_i\,\mathbf{h}_i}{\sum_{i=1}^{n} m_i}, \qquad \hat{\mathbf{e}} = \frac{\mathbf{e}}{\|\mathbf{e}\|}$$

      where $\mathbf{h}_i \in \mathbb{R}^d$ is the final hidden state of token $i$. After normalisation every embedding lies on
      the unit hypersphere, and similarity reduces to a dot product: $\cos(\hat{\mathbf{a}}, \hat{\mathbf{b}}) = \hat{\mathbf{a}}\cdot\hat{\mathbf{b}}$.

      A useful fact for intuition: in high dimensions, random unit vectors are nearly orthogonal (cosine ≈ 0 with spread
      ≈ $1/\sqrt{d}$). That is why trained embeddings with cosine 0.5 are "very related" even though 0.5 sounds modest — and
      why **absolute similarity thresholds don't transfer between models**.

  - kind: code
    title: Code
    body: |
      ```python
      # pip install sentence-transformers
      from sentence_transformers import SentenceTransformer
      import numpy as np

      model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")   # d = 384
      texts = [
          "How do I reset my password?",
          "I forgot my login credentials",
          "Best pizza in Naples",
      ]
      emb = model.encode(texts, normalize_embeddings=True)   # shape (3, 384), unit vectors
      print(emb.shape)

      sims = emb @ emb.T          # cosine similarity matrix (dot product of unit vectors)
      print(np.round(sims, 2))
      # The two account-related sentences score far higher with each other than with the pizza sentence.

      # Under the hood: mean pooling over token vectors, by hand
      from transformers import AutoTokenizer, AutoModel
      import torch

      name = "sentence-transformers/all-MiniLM-L6-v2"
      tok, enc = AutoTokenizer.from_pretrained(name), AutoModel.from_pretrained(name)
      batch = tok(texts, padding=True, truncation=True, return_tensors="pt")
      with torch.no_grad():
          hidden = enc(**batch).last_hidden_state            # (batch, seq, 384)
      mask = batch["attention_mask"].unsqueeze(-1).float()  # ignore padding
      mean = (hidden * mask).sum(1) / mask.sum(1)
      manual = torch.nn.functional.normalize(mean, dim=-1).numpy()
      print(np.allclose(manual, emb, atol=1e-4))            # True
      ```

  - kind: real_world
    title: Real-world engineering example
    body: |
      An internal help-desk RAG system kept retrieving the wrong policy for questions like *"Can contractors expense
      flights?"* — it returned the employee travel policy. Investigation showed:

      1. **Asymmetric mismatch.** The chosen model expected `query:`/`passage:` prefixes; the team had not added them.
      2. **Topic ≠ answer.** Both policies were about travel expenses, so they sat close together in embedding space; the
         decisive word "contractor" barely moved the vector.
      3. **Truncation.** Policies were embedded whole; the model silently truncated after 512 tokens, so the relevant
         contractor clause was never embedded at all.

      Fixes: correct prefixes, chunking (lesson rag-03), **hybrid search with BM25** so exact terms like "contractor" count
      (emb-07), and a small labelled eval set (recall@5) to prove each change helped. Embeddings capture *aboutness* well
      and *exact constraints* poorly — design around that.

  - kind: mistakes
    title: Common mistakes
    body: |
      - **Mixing embeddings from different models** (or model versions) in one index. Vectors from different models live in
        unrelated spaces; re-embed everything when you change models.
      - **Exceeding the model's max sequence length.** Input is truncated silently.
      - **Forgetting normalisation** when the index assumes unit vectors (inner-product search).
      - **Ignoring required query/passage prefixes or instructions.**
      - **Using a fixed similarity threshold from a blog post.** Calibrate thresholds on your own data, per model.
      - **Expecting embeddings to handle negation, numbers or exact IDs.** Combine with keyword search and metadata filters.
      - **Choosing a model only from a leaderboard.** Leaderboard averages hide domain and language differences — evaluate on your data.

  - kind: when
    title: When to use embeddings — and when not
    body: |
      **Use them** for meaning-based retrieval, clustering, deduplication of paraphrases, recommendation and routing.

      **Prefer something else** when:
      - Users search for **exact identifiers** (SKUs, error codes, names) → keyword/BM25 or a database index.
      - The decision depends on **logic, negation or numbers** → structured filters, rules or an LLM reading the candidates.
      - The corpus is **tiny** (dozens of items) → just put it in the prompt.
      - You need **explanations** of why items match → lexical methods or a reranker/LLM are more interpretable.

exercise:
  title: Probe an embedding space
  prompt: |
    Using any sentence-embedding model (e.g. `all-MiniLM-L6-v2` on Colab or locally), embed these sentences:

    1. "The medication is safe for children."
    2. "The medication is not safe for children."
    3. "This drug can be given to kids without risk."
    4. "Our quarterly revenue grew by 12%."

    Compute the cosine-similarity matrix and answer: Is (1, 2) more or less similar than (1, 3)? What does that tell you
    about using embeddings alone for safety-critical retrieval?
  starter: |
    from sentence_transformers import SentenceTransformer
    sents = [...]
    model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
    E = model.encode(sents, normalize_embeddings=True)
    S = E @ E.T
  expected: |
    A 4×4 symmetric matrix with 1.0 on the diagonal; sentence 4 has low similarity to all others.
    With most general-purpose models, sim(1, 2) is HIGH — often higher than sim(1, 3).
  hints:
    - With `normalize_embeddings=True`, the dot product equals cosine similarity.
    - Look at how much a single "not" moves the vector compared with a full paraphrase.
  solution: |
    import numpy as np
    from sentence_transformers import SentenceTransformer

    sents = ["The medication is safe for children.",
             "The medication is not safe for children.",
             "This drug can be given to kids without risk.",
             "Our quarterly revenue grew by 12%."]
    model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
    E = model.encode(sents, normalize_embeddings=True)
    print(np.round(E @ E.T, 2))
  explanation: |
    The negated sentence shares almost all tokens and the same topic as sentence 1, so it lands very close in
    embedding space — typically closer than the paraphrase with different words. Embeddings trained for topical
    similarity are weak at negation. In safety-critical retrieval, embeddings should only *propose candidates*;
    a reranker or LLM must read them, and evaluations must include negation cases.
  advanced: |
    Repeat with a second model (e.g. a larger retrieval model) and compare. Then build a 20-pair negation test set and
    report how often each model ranks the negation above the paraphrase.

quiz:
  - id: q1
    kind: mcq
    prompt: What determines which texts end up close together in an embedding space?
    options: ["The number of dimensions", "The training objective and the pairs the model was trained on", "The tokenizer's vocabulary size", "Alphabetical similarity of the words"]
    answer: 1
    explanation: Contrastive training defines what "similar" means; the geometry reflects the training pairs.
  - id: q2
    kind: mcq
    prompt: You switch embedding model from v1 to v2. What must you do with your vector index?
    options: ["Nothing, vectors are compatible", "Re-embed all documents with v2", "Normalise the old vectors", "Only re-embed new documents"]
    answer: 1
    explanation: Different models produce vectors in unrelated spaces; queries embedded by v2 cannot be compared with v1 documents.
  - id: q3
    kind: multi
    prompt: Which are common ways to turn per-token vectors into one sentence embedding?
    options: ["Mean pooling", "[CLS] token vector", "Last-token vector (decoder embedders)", "Concatenating all token vectors"]
    answer: [0, 1, 2]
    explanation: Concatenation would give variable-length vectors; the other three are standard pooling strategies.
  - id: q4
    kind: technical
    prompt: Why are individual embedding dimensions usually not interpretable, and what IS meaningful?
    keywords: [["distributed", "spread", "all dimensions"], ["rotat", "relative", "direction", "distance", "angle"]]
    model_answer: Meaning is distributed across all dimensions; the training objective only constrains relative geometry (similarities), so any rotation of the space is equally valid. Directions, angles and distances between vectors are meaningful — individual coordinates are not.
  - id: q5
    kind: practical
    prompt: Estimate the raw memory needed to store 20 million 768-dimensional float32 embeddings, and name two ways to reduce it.
    keywords: [["61", "60", "61.4", "62"], ["quantiz", "int8", "binary", "matryoshka", "truncat", "fewer dimensions", "pca"]]
    model_answer: "20,000,000 × 768 × 4 bytes ≈ 61.4 GB. Reduce with int8 or binary quantization (4× or 32×), Matryoshka truncation/smaller dimensionality, or product quantization in the index."
  - id: q6
    kind: scenario
    prompt: Users of your support search type error codes like "E-4021" and get irrelevant results from your embedding-based search. Diagnose and fix.
    keywords: [["exact", "identifier", "rare", "token"], ["bm25", "keyword", "hybrid", "lexical"]]
    model_answer: Embeddings capture topical meaning and handle rare exact identifiers poorly — "E-4021" is split into sub-word tokens with little semantic signal. Add lexical retrieval (BM25) or an exact-match index and fuse results (hybrid search), or route identifier-like queries to keyword search. Measure with an eval set containing such queries.
  - id: q7
    kind: short
    prompt: What does the contrastive loss with in-batch negatives do to a query vector during training?
    keywords: [["pull", "closer", "toward"], ["push", "away", "apart"], ["negative", "other passages", "batch"]]
    model_answer: It pulls the query toward its paired positive passage and pushes it away from the other passages in the same batch, which act as negatives.

flashcards:
  - front: What is a text embedding?
    back: A fixed-length vector (e.g. 384–4096 dims) whose geometry encodes semantic relatedness as defined by the model's training.
  - front: Contrastive training in one sentence
    back: Pull related pairs together and push unrelated (in-batch negative) examples apart in vector space.
  - front: Three things that break embedding search silently
    back: Mixed model versions in one index, input truncation beyond max length, and missing query/passage prefixes.
  - front: Why don't similarity thresholds transfer between models?
    back: Each model has its own similarity distribution; calibrate thresholds per model on your data.
  - front: What are embeddings weak at?
    back: Exact identifiers, negation, numbers and logical constraints — combine with keyword search, filters or rerankers.
