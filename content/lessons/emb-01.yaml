overview:
  what: What an embedding is, what its dimensions mean (and don't), how embedding models are trained, and how a sentence becomes one vector.
  why: Embeddings are the bridge between language and maths. Semantic search, RAG, clustering, recommendation, deduplication and classification all depend on them — and most RAG failures trace back to misunderstanding what an embedding can and cannot capture.
  where: Retrieval in RAG systems, semantic caching, duplicate detection, recommendation, topic clustering, routing queries to the right tool or model, and evaluation (embedding-based similarity metrics).
  prerequisites: "Dot products and cosine similarity (ma-02); learned embedding layers (sm-03); encoder models such as BERT (llm-03)."

sections:
  - kind: simple
    title: Simple explanation
    body: |
      An embedding is a **list of numbers that represents the meaning of something** — a word, a sentence, an image.
      The model that produces it is trained so that things with **similar meaning get similar lists of numbers**.

      Imagine a map where every sentence has a location. "How do I reset my password?" and "I forgot my login" are placed
      close together, while "Best pizza in Naples" is far away. An embedding is just the **coordinates** of a sentence
      on that map — except the map has hundreds or thousands of dimensions instead of two.

      Once text has coordinates, "find related text" becomes "find nearby points" — a geometry problem computers solve quickly.

  - kind: technical
    title: Technical explanation
    body: |
      An **embedding model** is a function $f: \text{input} \to \mathbb{R}^d$ (typically $d$ = 384–4096) trained so that
      a similarity function — usually cosine — reflects a notion of relatedness.

      **1. Token embeddings vs text embeddings.** Inside every transformer, each token ID is first mapped to a learned vector
      (an embedding *layer*, lesson sm-03). After the transformer layers, every token has a **contextual** vector — "bank" in
      "river bank" and "bank account" now differ. A **text embedding** compresses these per-token vectors into one vector by
      **pooling**: mean pooling over tokens, the `[CLS]` token's vector, or (for decoder-based embedders) the last token.

      **2. How they are trained — contrastive learning.** A plain pretrained BERT gives poor sentence similarity. Embedding
      models are fine-tuned on pairs $(q, p^+)$ that *should* be close (question–answer, query–clicked document, paraphrases)
      with a contrastive loss such as InfoNCE using **in-batch negatives**:

      $$\mathcal{L} = -\log \frac{\exp(\cos(q, p^+)/\tau)}{\sum_{j}\exp(\cos(q, p_j)/\tau)}$$

      The loss pulls each query toward its positive and pushes it away from every other passage in the batch.
      **The geometry therefore encodes whatever the training pairs define as "similar"** — this is the key insight.
      A model trained on paraphrases treats "the drug is safe" and "the drug is unsafe" as close (same topic, same words);
      it is not a logic engine.

      **3. What a dimension means.** Individual dimensions are generally **not interpretable** — meaning is distributed
      across all of them. What matters is *relative position*: directions and distances. Rotating the whole space would
      change every coordinate yet preserve all similarities.

      **4. Dimensionality trade-offs.** More dimensions can capture finer distinctions but cost memory and search time
      linearly: 10M vectors × 1024 dims × 4 bytes = **~41 GB**. Techniques such as Matryoshka training (usable prefixes),
      and int8/binary quantization trade a little accuracy for large savings.

      **5. Symmetric vs asymmetric tasks.** Comparing two sentences (symmetric) differs from matching a short question to a
      long passage (asymmetric). Many retrieval models therefore expect **instruction prefixes** (e.g. `query:` / `passage:`)
      — omit them and quality drops silently.

  - kind: diagram
    title: From text to vector
    svg: |
      <svg viewBox="0 0 640 150" role="img" aria-label="Pipeline: text, tokenizer, token ids, transformer encoder, per-token vectors, pooling, normalised embedding" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui" font-size="12">
