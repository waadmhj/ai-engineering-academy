        <g fill="none" stroke="currentColor">
          <rect x="5" y="45" width="90" height="50" rx="8"/><rect x="120" y="45" width="80" height="50" rx="8"/>
          <rect x="225" y="35" width="110" height="70" rx="8" stroke="var(--accent, #6366f1)" stroke-width="2"/>
          <rect x="360" y="45" width="90" height="50" rx="8"/><rect x="475" y="45" width="70" height="50" rx="8"/>
          <rect x="565" y="45" width="70" height="50" rx="8" stroke="var(--accent, #6366f1)" stroke-width="2"/>
        </g>
        <g fill="currentColor" text-anchor="middle">
