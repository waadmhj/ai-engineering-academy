  - kind: math
    title: Worked example (3 tokens, d_k = 2)
    body: |
      Suppose after projection

      $$Q = \begin{bmatrix}1&0\\0&1\\1&1\end{bmatrix},\; K = \begin{bmatrix}1&0\\0&1\\1&1\end{bmatrix},\; V = \begin{bmatrix}1&0\\0&2\\3&3\end{bmatrix}$$

      Scores for token 3 (query $(1,1)$): $K q_3 = (1, 1, 2)$, scaled by $\sqrt{2}$: $(0.71, 0.71, 1.41)$.

      Causal mask: token 3 may see tokens 1–3, so nothing is masked for this row.
      Softmax: $e^{0.71}=2.03,\; e^{1.41}=4.11$ → weights $\approx (0.25, 0.25, 0.50)$.

      Output: $0.248\,(1,0) + 0.248\,(0,2) + 0.503\,(3,3) \approx (1.76, 2.01)$.

      For token 1 the causal mask hides tokens 2 and 3, so its weights are $(1, 0, 0)$ and its output is just $v_1 = (1, 0)$.

  - kind: code
    title: Code
    body: |
      ```python
      import torch
      import torch.nn.functional as F

      def self_attention(x, Wq, Wk, Wv, causal=True):
          """x: (n, d). Returns (n, d_v) and the attention weights (n, n)."""
          q, k, v = x @ Wq, x @ Wk, x @ Wv
          d_k = q.shape[-1]
          scores = q @ k.T / d_k ** 0.5                     # (n, n)
          if causal:
              n = x.shape[0]
              mask = torch.triu(torch.ones(n, n, dtype=torch.bool), diagonal=1)
              scores = scores.masked_fill(mask, float("-inf"))
          weights = scores.softmax(dim=-1)                  # rows sum to 1
          return weights @ v, weights

      class MultiHeadAttention(torch.nn.Module):
          def __init__(self, d_model: int, n_heads: int):
              super().__init__()
              assert d_model % n_heads == 0
              self.h, self.d_k = n_heads, d_model // n_heads
              self.qkv = torch.nn.Linear(d_model, 3 * d_model, bias=False)
              self.out = torch.nn.Linear(d_model, d_model, bias=False)

          def forward(self, x):                  # x: (batch, n, d_model)
              B, n, d = x.shape
              q, k, v = self.qkv(x).split(d, dim=-1)
              # (B, n, d) -> (B, h, n, d_k)
              q, k, v = (t.view(B, n, self.h, self.d_k).transpose(1, 2) for t in (q, k, v))
              y = F.scaled_dot_product_attention(q, k, v, is_causal=True)  # fused (FlashAttention when available)
              y = y.transpose(1, 2).contiguous().view(B, n, d)             # concat heads
              return self.out(y)

      torch.manual_seed(0)
      mha = MultiHeadAttention(d_model=64, n_heads=8)
      print(mha(torch.randn(2, 10, 64)).shape)   # torch.Size([2, 10, 64])
      ```

  - kind: real_world
    title: Real-world engineering example
    body: |
      A team moved a document-QA feature from 8k-token to 128k-token prompts "to avoid building retrieval". Latency and
      cost rose sharply, and accuracy on questions about the middle of long documents *dropped*.

      Self-attention explains both effects:
      - **Prefill compute grows quadratically with prompt length** (FlashAttention reduces memory traffic, not the $n^2$
        arithmetic), and the **KV cache grows linearly** per token per layer — limiting how many requests fit on a GPU.
      - Softmax weights are spread across 128k positions; models are empirically weaker at using information buried in the
        middle (*Lost in the Middle*).

      They returned to retrieval + a moderate context window, reordering the most relevant chunks to the beginning and end.
      Understanding attention turned "just use a bigger context" from a default into a measured trade-off.

  - kind: mistakes
    title: Common mistakes
    body: |
      - **Forgetting the $\sqrt{d_k}$ scaling** → saturated softmax, vanishing gradients, unstable training.
      - **Masking with 0 instead of $-\infty$** before softmax — a score of 0 still receives weight.
      - **Applying the mask after softmax** — rows no longer sum to 1 and future information has already leaked.
      - **Wrong reshape when splitting heads** (`view` without `transpose`) silently mixes heads across tokens.
      - **Assuming attention weights are explanations.** They show information flow in one layer/head, not causal reasons for a prediction.
      - **Padding tokens not masked** in batched inputs — real tokens attend to padding.

  - kind: when
    title: When to use it — and when not
    body: |
      - Self-attention excels when **any position may depend on any other** (language, code, documents).
      - For **very long sequences** consider retrieval, chunking, sliding-window/sparse attention or state-space models
        rather than paying the full $O(n^2)$ cost.
      - For **small, local-structure problems** (tabular data, simple time series), CNNs, RNNs or gradient-boosted trees are often
        cheaper and just as good.
      - In practice, **call `F.scaled_dot_product_attention`** (fused, memory-efficient kernels) rather than hand-writing it.

exercise:
  title: Implement causal self-attention and verify it
  prompt: |
    Implement `causal_attention(q, k, v)` for tensors of shape `(n, d)` using only basic tensor operations (no
    `scaled_dot_product_attention`). Then verify your result against
    `torch.nn.functional.scaled_dot_product_attention(q, k, v, is_causal=True)` on random inputs.
  starter: |
    import torch

    def causal_attention(q, k, v):
        ...
  expected: |
    torch.allclose(causal_attention(q, k, v),
                   F.scaled_dot_product_attention(q, k, v, is_causal=True), atol=1e-6)  # True
  hints:
    - "`torch.triu(torch.ones(n, n, dtype=torch.bool), diagonal=1)` marks the future positions."
    - Fill masked scores with `float('-inf')` BEFORE the softmax.
    - Scale by `q.shape[-1] ** 0.5`.
  solution: |
    import torch
    import torch.nn.functional as F

    def causal_attention(q, k, v):
        n, d_k = q.shape
        scores = q @ k.transpose(-2, -1) / d_k ** 0.5
        future = torch.triu(torch.ones(n, n, dtype=torch.bool), diagonal=1)
        scores = scores.masked_fill(future, float("-inf"))
        return scores.softmax(dim=-1) @ v

    q, k, v = (torch.randn(6, 16) for _ in range(3))
    print(torch.allclose(causal_attention(q, k, v),
                         F.scaled_dot_product_attention(q, k, v, is_causal=True), atol=1e-6))
  explanation: |
    The upper-triangular mask (above the diagonal) marks positions j > i. Setting those scores to −∞ makes their
    exponentials 0, so each row's softmax distributes weight only over the current and previous tokens. The first row
    therefore attends only to itself. Matching PyTorch's fused kernel confirms the scaling and masking are correct.
  advanced: |
    Extend to batched multi-head inputs of shape (B, h, n, d_k) and add a key-padding mask. Then measure peak memory of
    your version vs `scaled_dot_product_attention` for n = 4096 on a GPU and explain the difference (FlashAttention).

quiz:
  - id: q1
    kind: mcq
    prompt: Why are attention scores divided by √d_k?
    options: ["To make them positive", "To keep their variance ≈ 1 so softmax doesn't saturate", "To normalise rows to sum to 1", "To reduce memory use"]
    answer: 1
    explanation: Dot products of d_k unit-variance terms have variance d_k; large magnitudes push softmax into saturation and shrink gradients.
  - id: q2
    kind: mcq
    prompt: Sequence length doubles from 4k to 8k tokens. How does the size of the attention score matrix change?
    options: ["Doubles", "Quadruples", "Stays the same", "Increases by √2"]
    answer: 1
    explanation: "The score matrix is n × n: (2n)² = 4n²."
  - id: q3
    kind: multi
    prompt: Which statements about causal self-attention are true?
    options: ["Token i cannot attend to tokens after i", "Masked scores are set to -inf before softmax", "It allows training on every next-token prediction in one forward pass", "It makes the model aware of word order without positional encodings"]
    answer: [0, 1, 2]
    explanation: The causal mask restricts visibility but attention remains order-agnostic beyond that; positional encodings are still needed.
  - id: q4
    kind: technical
    prompt: Explain the roles of queries, keys and values in one or two sentences each.
    keywords: [["query", "looking for"], ["key", "match", "compared"], ["value", "information", "content", "weighted"]]
    model_answer: A query represents what the current token is looking for; keys represent what each token offers and are compared with the query (dot product) to produce relevance scores; values carry the information that is mixed into the output, weighted by the softmaxed scores.
  - id: q5
    kind: practical
    prompt: "A model has d_model = 4096 and 32 heads. What is d_k per head, and how does multi-head compute compare with one 4096-wide head?"
    keywords: [["128"], ["same", "similar", "equal", "comparable"]]
    model_answer: "d_k = 4096 / 32 = 128. Total projection and attention compute is about the same as a single head of width 4096; the work is just split into 32 independent subspaces that can specialise."
  - id: q6
    kind: scenario
    prompt: During generation, your naive implementation recomputes K and V for the whole prefix at every new token and is very slow. What property of causal attention lets you fix this, and how?
    keywords: [["past", "previous", "prefix"], ["don't change", "do not change", "unchanged", "fixed"], ["cache", "kv cache"]]
    model_answer: In a causal model the keys and values of earlier tokens never change when new tokens are appended, so they can be cached. Each step computes Q, K, V only for the new token, appends K and V to the KV cache, and attends over the cached keys/values — turning per-step cost from re-processing the full prefix into a single-token update.
  - id: q7
    kind: short
    prompt: Why does attention need positional encodings?
    keywords: [["order", "position"], ["permutation", "set", "invariant", "equivariant"]]
    model_answer: Attention treats its inputs as a set — permuting the tokens just permutes the outputs — so without positional information the model cannot distinguish word order.

flashcards:
  - front: Scaled dot-product attention formula
    back: "softmax(QKᵀ / √d_k + M) V"
  - front: Purpose of the causal mask
    back: Prevent token i from attending to tokens j > i (set their scores to −∞ before softmax).
  - front: Complexity of self-attention in sequence length n
    back: "O(n²) compute and score-matrix memory (FlashAttention avoids materialising it, but compute stays quadratic)."
  - front: Why multi-head attention?
    back: Several heads attend in different learned subspaces in parallel, specialising in different relationships, for about the same compute.
  - front: What makes the KV cache possible?
    back: In causal attention, keys/values of past tokens never change, so they can be stored and reused at each generation step.
