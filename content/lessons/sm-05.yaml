overview:
  what: Scaled dot-product self-attention, causal masking and multi-head attention — derived, implemented and interpreted.
  why: Self-attention is the core computation of every transformer and therefore every LLM. Context windows, KV caches, inference cost, long-context failures and FlashAttention all follow from how it works.
  where: Every LLM forward pass; embedding models; vision transformers; the cost model behind context-window pricing; inference optimisations (KV cache, PagedAttention, GQA) you will study in Stage 5.
  prerequisites: "Dot products and matrix multiplication (ma-02), softmax and cross-entropy (nn-06), the attention idea from seq2seq (sm-04), PyTorch tensors (pt-01)."

sections:
  - kind: simple
    title: Simple explanation
    body: |
      In the sentence *"The animal didn't cross the street because **it** was too tired"*, to understand "it" you need to
      look back at "animal". Self-attention lets every word **look at every other word** and decide how much each one matters
      for understanding itself.

      Each word plays three roles:
      - a **query** — "what am I looking for?"
      - a **key** — "what do I contain?" (used by others to decide whether to look at me)
      - a **value** — "what information do I hand over if you look at me?"

      Each word compares its query with every key, turns the scores into percentages (softmax), and takes a weighted
      average of the values. "it" ends up mixing in a lot of "animal".

      **Multi-head** attention does this several times in parallel with different learned roles — one head might track
      grammar, another coreference, another position.

  - kind: technical
    title: Technical explanation
    body: |
      Let $X \in \mathbb{R}^{n \times d}$ be the $n$ token vectors entering a layer. Three learned matrices project them:

      $$Q = XW_Q,\quad K = XW_K,\quad V = XW_V \qquad (W_Q, W_K \in \mathbb{R}^{d\times d_k},\; W_V \in \mathbb{R}^{d\times d_v})$$

      **Scaled dot-product attention:**

      $$\text{Attention}(Q,K,V) = \text{softmax}\!\left(\frac{QK^\top}{\sqrt{d_k}} + M\right)V$$

      1. $QK^\top \in \mathbb{R}^{n\times n}$ — every query dotted with every key: raw relevance scores.
      2. **Scale by $\sqrt{d_k}$.** If query/key components have unit variance, a dot product of $d_k$ terms has variance $d_k$.
         Large scores saturate the softmax (one weight ≈ 1, others ≈ 0) and gradients vanish. Dividing by $\sqrt{d_k}$ restores unit variance.
      3. **Mask $M$.** In decoder (GPT-style) models, token $i$ may not see tokens $j > i$; set those scores to $-\infty$
         so their softmax weight is 0. This **causal mask** is what lets one forward pass train on every next-token prediction at once.
      4. **Row-wise softmax** turns each row into weights summing to 1.
      5. **Multiply by $V$** — each output row is a weighted average of value vectors.

      **Multi-head attention** splits the model width into $h$ heads of size $d_k = d/h$, runs attention independently in
      each, concatenates the results and mixes them with $W_O$:

      $$\text{MHA}(X) = \text{Concat}(\text{head}_1,\dots,\text{head}_h)\,W_O$$

      Same total compute as one wide head, but the heads can specialise in different relationships.

      **Properties that matter in engineering**
      - **Permutation-equivariant:** attention alone has no notion of order → positional encodings are required (sm-06).
      - **Quadratic cost:** the score matrix is $n\times n$ — doubling context length quadruples attention compute and
        (naively) memory. This drives context-window pricing and FlashAttention.
      - **Keys/values of past tokens never change** in a causal model → they can be cached during generation (the **KV cache**, inf-02).

