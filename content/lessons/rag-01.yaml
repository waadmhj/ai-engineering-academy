overview:
  what: The architecture of a Retrieval-Augmented Generation system — its offline indexing path, its online query path, and the decisions at each stage.
  why: RAG is the most common production pattern for LLM applications. Teams that treat it as "embed, search, stuff into prompt" ship systems that hallucinate, miss answers and cannot be improved systematically.
  where: Enterprise knowledge assistants, customer support, documentation search, legal/medical research tools, coding assistants, and this platform's own AI tutor.
  prerequisites: "Embeddings and similarity (emb-01, emb-02), semantic search and ANN (emb-04, emb-05), hybrid search (emb-07), structured prompting (pe-03), LLM APIs (api-01)."

sections:
  - kind: simple
    title: Simple explanation
    body: |
      An LLM is like a brilliant student who studied a huge library — years ago — and is taking a **closed-book exam**.
      It may not know your company's documents, last week's changes, or the exact wording of a policy, and when unsure it
      sometimes makes things up.

      RAG turns it into an **open-book exam**: before answering, a search system finds the few most relevant pages from
      *your* documents and hands them to the model with the instruction "answer using these pages, and cite them".

      Two halves:
      - **Indexing (offline):** prepare the library — split documents into passages and make them searchable.
      - **Answering (online):** for each question — find the best passages, then let the model write a grounded answer.

  - kind: technical
    title: Technical explanation
    body: |
      **Offline indexing pipeline**
      1. **Ingest** sources (files, wikis, tickets, databases) with metadata: source, owner, timestamps, permissions.
      2. **Parse** to clean text while preserving structure (headings, tables, page numbers).
      3. **Chunk** into retrievable units sized for both retrieval precision and answer completeness.
      4. **Enrich** (optional): add titles/section paths, contextual summaries, extracted entities.
      5. **Embed** chunks (dense) and **index** them for lexical search (sparse/BM25).
      6. **Store** vectors + text + metadata; version the index by embedding model and chunking config.

      **Online query pipeline**
      1. **Understand the query:** rewrite, expand, decompose or route (some queries need no retrieval at all).
      2. **Retrieve** candidates — dense, sparse or hybrid — with **metadata filters** (tenant, permissions, date).
      3. **Rerank** the top ~20–100 candidates with a cross-encoder or LLM for precision.
      4. **Assemble context:** select, order, deduplicate and fit within a token budget.
      5. **Generate** with a grounded prompt: answer only from sources, cite them, refuse when insufficient.
      6. **Post-process:** verify citations, apply guardrails, log the trace for evaluation.

      **Why it works.** It separates *knowledge* (updatable, auditable documents) from *reasoning and language* (the model).
      You can update knowledge by re-indexing instead of re-training, enforce access control at retrieval time, and show users
      where answers came from.

      **Where it fails — the failure taxonomy you must evaluate against**
      | Stage | Failure | Symptom |
      |---|---|---|
      | Ingestion/parsing | content lost (tables, scans) | "I don't know" for answerable questions |
      | Chunking | answer split across chunks; context lost | partial or wrong answers |
      | Retrieval | relevant chunk not in top-k | confident answers from wrong passages |
      | Ranking/context | right chunk present but buried | ignored evidence ("lost in the middle") |
      | Generation | unfaithful to context | hallucinated details despite good retrieval |
      | Data | stale, contradictory or unauthorised sources | correct-looking but wrong or leaked answers |

      **Retrieval and generation must be evaluated separately** (rag-10, ev-06): if the evidence was never retrieved,
      no prompt can fix it.

