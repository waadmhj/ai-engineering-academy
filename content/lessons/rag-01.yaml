  - kind: math
    title: The probabilistic view (from the original RAG paper)
    body: |
      Lewis et al. (2020) treat the retrieved document $z$ as a latent variable:

      $$p(y \mid x) \approx \sum_{z \in \text{top-}k(p_\eta(\cdot \mid x))} p_\eta(z \mid x)\; p_\theta(y \mid x, z)$$

      - $p_\eta(z \mid x)$ — the **retriever**: how likely document $z$ is relevant to query $x$ (from embedding similarity).
      - $p_\theta(y \mid x, z)$ — the **generator**: how likely answer $y$ is given the query and that document.

      Two engineering consequences fall straight out of this formula:
      1. If the relevant $z$ is not in the top-$k$, its term is simply **missing** — the generator cannot recover it.
         Retrieval recall@k is an upper bound on answer quality.
      2. The answer is only as good as the generator's **faithfulness** to $z$ — measured separately.

  - kind: code
    title: Code — a minimal, honest RAG pipeline
    body: |
      ```python
      # A deliberately framework-free pipeline: every step is visible and testable.
      from dataclasses import dataclass
      import numpy as np
      from rank_bm25 import BM25Okapi                  # pip install rank-bm25
      from sentence_transformers import SentenceTransformer

      @dataclass
      class Chunk:
          id: str
          doc: str
          text: str

      class RagIndex:
          def __init__(self, chunks: list[Chunk], model_name="sentence-transformers/all-MiniLM-L6-v2"):
              self.chunks = chunks
              self.model = SentenceTransformer(model_name)
              self.vecs = self.model.encode([c.text for c in chunks], normalize_embeddings=True)
              self.bm25 = BM25Okapi([c.text.lower().split() for c in chunks])

          def retrieve(self, query: str, k: int = 5) -> list[Chunk]:
              dense = self.vecs @ self.model.encode(query, normalize_embeddings=True)
              sparse = self.bm25.get_scores(query.lower().split())
              # Reciprocal rank fusion of the two rankings
              fused: dict[int, float] = {}
              for ranking in (np.argsort(-dense), np.argsort(-sparse)):
                  for rank, i in enumerate(ranking[:50], start=1):
                      fused[int(i)] = fused.get(int(i), 0.0) + 1 / (60 + rank)
              best = sorted(fused, key=fused.get, reverse=True)[:k]
              return [self.chunks[i] for i in best]

      SYSTEM = ("Answer ONLY from the numbered sources. Cite sources like [1]. "
                "If the sources are insufficient, say you don't know.")

      def build_prompt(question: str, chunks: list[Chunk]) -> str:
          sources = "\n\n".join(f'<source id="{i}" doc="{c.doc}">\n{c.text}\n</source>'
                                for i, c in enumerate(chunks, start=1))
          return f"{sources}\n\n<question>{question}</question>"

      def answer(question: str, index: RagIndex, llm) -> dict:
          chunks = index.retrieve(question, k=5)
          text = llm(system=SYSTEM, user=build_prompt(question, chunks))
          return {"answer": text, "sources": [c.id for c in chunks]}   # log this for evaluation
      ```

      In the workshop for lesson rag-04 you build this same pipeline from your own components — and something on this
      platform starts running on it.

  - kind: real_world
    title: Real-world engineering example
    body: |
      An HR assistant answered "How many vacation days do new hires get?" with **25** — the number from an outdated 2021
      policy. The current policy said 20. Tracing showed both documents were retrieved; the old one ranked first because it
      had a cleaner heading.

      The fixes were architectural, not prompt tweaks:
      - **Ingestion:** mark superseded documents and exclude them with a metadata filter (`status = current`).
      - **Retrieval:** boost recency for policy documents; deduplicate near-identical chunks across versions.
      - **Generation:** instruct the model to prefer the most recent effective date and to mention conflicts.
      - **Evaluation:** add "conflicting versions" cases to the golden set so this class of bug is caught automatically.

      Most production RAG improvements look like this: data management and retrieval engineering, verified by evals.

  - kind: mistakes
    title: Common mistakes
    body: |
      - **Starting with a framework** before understanding each stage — you cannot debug what you cannot see.
      - **No evaluation set.** Without labelled questions + relevant passages, every change is a guess.
      - **Evaluating only end-to-end answers.** Measure retrieval recall@k separately from generation faithfulness.
      - **Stuffing the context** with 20+ chunks "to be safe": higher cost, latency, and *lower* accuracy.
      - **Ignoring access control** — retrieving documents the user may not see is a data leak, even if the LLM "doesn't mention it".
      - **Treating retrieved text as trusted.** Documents can contain prompt injections.
      - **Not versioning the index** by embedding model and chunking configuration.

  - kind: when
    title: When to use RAG — and when not
    body: |
      **Use RAG** when answers depend on a body of knowledge that is private, large, changes over time, or must be cited.

      **Consider alternatives** when:
      - The knowledge fits comfortably in the context window and changes rarely → put it in the prompt (with prompt caching).
      - You need a new **behaviour, style or format** rather than knowledge → fine-tuning (ft-01).
      - Answers come from **structured data** (counts, sums, joins) → text-to-SQL or tool calls, not chunk retrieval.
      - Questions are **global** ("what are the main themes across all reports?") → GraphRAG or map-reduce summarisation (rag-09).

exercise:
  title: Diagnose a RAG failure from its trace
  prompt: |
    A user asks *"Does the Pro plan include SSO?"*. The system answers *"No, SSO is only available on Enterprise."*
    — which is wrong (Pro gained SSO last month). The trace shows:

    ```
    retrieved (top 5): pricing-2024.md#plans (score 0.82), faq.md#sso (0.79), pricing-2024.md#enterprise (0.77),
                       changelog.md#2025-10 (0.61, rank 9 → cut), security.md#saml (0.58)
    prompt tokens: 2,950    model: small-model-x    citations in answer: [1], [3]
    ```

    1. Which pipeline stage failed? 2. Propose **three** concrete changes, each at a different stage.
    3. How would you prove the fix works and stays fixed?
  starter: |
    1. Failing stage: ...
    2. Changes:
       - ...
    3. Verification: ...
  expected: A diagnosis identifying retrieval/ranking (the up-to-date changelog chunk fell outside top-k) plus stale data, with fixes spanning data, retrieval and evaluation.
  hints:
    - Was the correct information retrieved at all? Where did it rank?
    - Is pricing-2024.md still the source of truth?
    - What test would have caught this before users did?
  solution: |
    1. Retrieval/ranking (and data freshness): the correct evidence (changelog 2025-10) existed but ranked 9th and was cut;
       the outdated pricing page ranked first. Generation was faithful to what it was given.
    2. Changes:
       - Data: update or mark pricing-2024.md as superseded; ingest the current pricing page; add effective-date metadata.
       - Retrieval: add a recency boost/filter for pricing and plan documents; increase candidate pool and add a reranker
         so the changelog chunk can surface; deduplicate overlapping plan chunks.
       - Generation: instruct the model to prefer the most recent effective date and to flag conflicts between sources.
    3. Add this question (and paraphrases) with the correct passage to the golden set; check retrieval recall@5 and answer
       correctness before/after; run the eval suite in CI so a future regression fails the build.
  explanation: |
    The key skill is localising the failure: since the model faithfully cited the (outdated) sources it received,
    tweaking the generation prompt alone would not fix it. The evidence ranking and the data lifecycle did.
    Every fix is then locked in with an eval case — that is how RAG systems improve monotonically instead of by anecdote.
  advanced: |
    Design a "freshness" metric for your eval suite: for questions with time-sensitive answers, measure how often the most
    recent relevant source is retrieved in the top-k. Which architecture changes most improve it?

quiz:
  - id: q1
    kind: mcq
    prompt: In the RAG formula p(y|x) ≈ Σ p(z|x) p(y|x,z) over top-k documents, what happens if the relevant document is not retrieved?
    options: ["The generator compensates using its parameters", "Its contribution is missing — the answer cannot be grounded in it", "The reranker adds it back", "The probability is renormalised to include it"]
    answer: 1
    explanation: Only top-k documents contribute; retrieval recall bounds answer quality.
  - id: q2
    kind: multi
    prompt: Which belong to the OFFLINE indexing path?
    options: ["Parsing documents", "Chunking", "Reranking candidates for a query", "Embedding chunks", "Query rewriting"]
    answer: [0, 1, 3]
    explanation: Reranking and query rewriting happen per query, online.
  - id: q3
    kind: mcq
    prompt: A RAG system answers incorrectly, but the correct passage WAS in the retrieved context and the answer contradicts it. Which stage most likely failed?
    options: ["Ingestion", "Retrieval", "Generation (faithfulness)", "Chunking"]
    answer: 2
    explanation: The evidence was present; the model failed to use it faithfully.
  - id: q4
    kind: technical
    prompt: Why should retrieval and generation be evaluated separately?
    keywords: [["recall", "retrieval", "retrieved"], ["faithful", "generation", "grounded"], ["localis", "localiz", "diagnos", "which stage", "isolate"]]
    model_answer: Because they fail differently and need different fixes. Retrieval metrics (recall@k, MRR) show whether the evidence reached the model; generation metrics (faithfulness, relevance) show whether the model used it correctly. End-to-end scores alone cannot localise a failure to a stage.
  - id: q5
    kind: practical
    prompt: Name two ways to enforce document-level permissions in a multi-user RAG system and say which stage they belong to.
    keywords: [["metadata", "filter", "acl"], ["retriev", "index", "tenant", "namespace", "collection"]]
    model_answer: (1) Store ACL/tenant metadata with each chunk and apply a mandatory filter at retrieval time; (2) physically separate indexes/namespaces/collections per tenant. Both belong to the retrieval/index layer — never rely on the LLM to withhold unauthorised content.
  - id: q6
    kind: scenario
    prompt: A manager asks you to "just send the top 30 chunks to be safe". Argue for or against with at least two technical reasons.
    keywords: [["cost", "token"], ["latency"], ["lost in the middle", "noise", "distract", "precision", "accuracy"]]
    model_answer: "Against, unless measured. More chunks increase token cost and latency, and add irrelevant or conflicting text that can reduce accuracy (models underuse information in the middle of long contexts and are distracted by noise). Better: retrieve a larger candidate set, rerank, and pass the best few — then validate the chosen k with the eval set."
  - id: q7
    kind: short
    prompt: Give one situation where RAG is the wrong tool and what you would use instead.
    keywords: [["structured", "sql", "aggregate", "count"], ["fine-tun", "style", "format", "behavio"], ["small", "fits", "context", "prompt"], ["global", "theme", "graph"]]
    model_answer: "Examples: aggregate questions over structured data (use text-to-SQL/tools); changing tone or output format (fine-tuning or prompting); a small static knowledge base (put it in the prompt with caching); global thematic questions (GraphRAG or map-reduce summarisation)."

flashcards:
  - front: The two pipelines of a RAG system
    back: "Offline indexing (ingest → parse → chunk → embed/index → store) and online querying (rewrite → retrieve → rerank → assemble → generate → verify)."
  - front: What bounds a RAG system's answer quality?
    back: Retrieval recall@k — evidence not retrieved cannot be used.
  - front: Where must access control be enforced in RAG?
    back: At retrieval/index time via mandatory metadata filters or per-tenant indexes — never by the LLM.
  - front: RAG vs fine-tuning in one line
    back: RAG adds knowledge (updatable, citable); fine-tuning changes behaviour, style or format.
  - front: Why version a vector index?
    back: Embedding model and chunking changes produce incompatible vectors; versioning enables safe re-indexing and comparisons.
