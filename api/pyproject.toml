[project]
name = "academy-api"
version = "0.1.0"
description = "AI Engineering Academy — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "pytest>=8",  # runtime: Tutor Forge verifies workshop code with pytest
]

[project.optional-dependencies]
dev = []
postgres = ["psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
